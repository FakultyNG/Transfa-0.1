# pubspec.yaml
name: transfa
description: "Transfa - NGN wallet & international transfers fintech app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  intl: ^0.20.1
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.16
  camera: ^0.10.5+9
  image: ^4.8.0
  image_picker: ^1.0.5
  permission_handler: ^11.0.1
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true

  fonts:
    - family: SegoeScript
      fonts:
        - asset: assets/fonts/segoesc.ttf

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#FCFCFB"
  adaptive_icon_foreground: "assets/launcher_icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#FCFCFB"
